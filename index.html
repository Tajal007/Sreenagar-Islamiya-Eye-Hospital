<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sreenagar Islamia Eye Hospital</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: sans-serif;
        }
        .card-custom {
            background-color: #1c2541;
            border: none;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-control, .form-select {
            background-color: #0b132b;
            border: 1px solid #3a506b;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0b132b;
            color: #ffffff;
            border-color: #6fffe9;
            box-shadow: none;
        }
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
            .card-custom {
                background-color: #ffffff !important;
                color: #000000 !important;
                border: 1px solid #ddd !important;
            }
            .form-control, .form-select {
                background-color: #fff !important;
                color: #000 !important;
                border: 1px solid #000 !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header Title -->
    <div class="text-center mb-4">
        <h2>শ্রীনগর ইসলামীয়া চক্ষু হাসপাতাল</h2>
        <p class="text-muted">Sreenagar Islamia Eye Hospital</p>
    </div>

    <!-- Section 1: Billing & Fees Entry (With Cost, Sales & Profit Details) -->
    <div class="card card-custom">
        <h4 class="mb-3">New Patient Bill & Service Entry</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Date</label>
                <input type="text" id="billDate" class="form-control" value="06/10/2026">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Patient Name</label>
                <input type="text" id="patientName" class="form-control" placeholder="Enter name">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Age</label>
                <input type="text" id="patientAge" class="form-control" placeholder="e.g. 35 yrs">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" id="patientMobile" class="form-control" placeholder="017xxxxxxxx">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Address</label>
                <input type="text" id="patientAddress" class="form-control" placeholder="Address">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Doctor Name</label>
                <select id="doctorName" class="form-control">
                    <option value="">Select Doctor</option>
                    <option value="Dr. Specialist Surgeon">Dr. Specialist Surgeon</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Specialization</label>
                <input type="text" id="doctorType" class="form-control" value="Eye Specialist & Optom" readonly>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Reference Name</label>
                <input type="text" id="referenceName" class="form-control" placeholder="Reference">
            </div>
            <!-- Financial Details for Billing -->
            <div class="col-md-4 mb-3">
                <label class="form-label">Cost Rate (BDT)</label>
                <input type="number" id="billCost" class="form-control" placeholder="Cost" oninput="calculateBillProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sales Rate (BDT)</label>
                <input type="number" id="billSales" class="form-control" placeholder="Sales" oninput="calculateBillProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Profit Percentage (%)</label>
                <input type="text" id="billProfit" class="form-control" readonly placeholder="Auto Profit">
            </div>
        </div>
        <button class="btn btn-primary w-100 no-print mb-2" onclick="savePatientBill()">Save & Print Patient Bill</button>
    </div>

    <!-- Section 2: Medicine Stock Management -->
    <div class="card card-custom">
        <h4 class="mb-3">Medicine Stock Management</h4>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Medicine Name</label>
                <input type="text" id="medName" class="form-control" placeholder="Medicine Name">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Category</label>
                <input type="text" id="medCategory" class="form-control" placeholder="Drop / Tablet">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" id="medQty" class="form-control" placeholder="Qty">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Cost Rate (BDT)</label>
                <input type="number" id="medCost" class="form-control" placeholder="Cost" oninput="calcMedProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sales Rate (BDT)</label>
                <input type="number" id="medSales" class="form-control" placeholder="Sales" oninput="calcMedProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Profit Percentage (%)</label>
                <input type="text" id="medProfit" class="form-control" readonly placeholder="Auto Profit">
            </div>
        </div>
        <button class="btn btn-success w-100 no-print mb-2" onclick="addMedicineStock()">Add Medicine Stock</button>
        <button class="btn btn-info w-100 no-print" onclick="printSection('Medicine Stock Report')">Print Medicine Stock</button>
    </div>

    <!-- Section 3: Glasses / Frame Stock Management -->
    <div class="card card-custom">
        <h4 class="mb-3">Glasses / Frame Stock Management</h4>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Frame / Glasses Name</label>
                <input type="text" id="glassName" class="form-control" placeholder="Frame Name">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Model / Type</label>
                <input type="text" id="glassModel" class="form-control" placeholder="Model / Code">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" id="glassQty" class="form-control" placeholder="Qty">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Cost Rate (BDT)</label>
                <input type="number" id="glassCost" class="form-control" placeholder="Cost" oninput="calcGlassProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sales Rate (BDT)</label>
                <input type="number" id="glassSales" class="form-control" placeholder="Sales" oninput="calcGlassProfit()">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Profit Percentage (%)</label>
                <input type="text" id="glassProfit" class="form-control" readonly placeholder="Auto Profit">
            </div>
        </div>
        <button class="btn btn-success w-100 no-print mb-2" onclick="addGlassStock()">Add Glasses Stock</button>
        <button class="btn btn-info w-100 no-print" onclick="printSection('Glasses Stock Report')">Print Glasses Stock</button>
    </div>

    <!-- Section 4: Expense Management -->
    <div class="card card-custom">
        <h4 class="mb-3">Expense Management</h4>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Expense Date</label>
                <input type="text" id="expDate" class="form-control" value="06/10/2026">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Expense Reason / Title</label>
                <input type="text" id="expReason" class="form-control" placeholder="e.g. Electricity Bill">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Amount (BDT)</label>
                <input type="number" id="expAmount" class="form-control" placeholder="Amount">
            </div>
        </div>
        <button class="btn btn-warning w-100 no-print mb-2 text-dark" onclick="saveExpense()">Save Expense</button>
        <button class="btn btn-secondary w-100 no-print" onclick="printSection('Expense Report')">Print Expense Report</button>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    function calculateBillProfit() {
        let cost = parseFloat(document.getElementById('billCost').value) || 0;
        let sales = parseFloat(document.getElementById('billSales').value) || 0;
        if (cost > 0 && sales >= cost) {
            let profit = sales - cost;
            let percentage = (profit / cost) * 100;
            document.getElementById('billProfit').value = percentage.toFixed(2) + '%';
        } else {
            document.getElementById('billProfit').value = '0%';
        }
    }

    function calcMedProfit() {
        let cost = parseFloat(document.getElementById('medCost').value) || 0;
        let sales = parseFloat(document.getElementById('medSales').value) || 0;
        if (cost > 0 && sales >= cost) {
            let profit = sales - cost;
            let percentage = (profit / cost) * 100;
            document.getElementById('medProfit').value = percentage.toFixed(2) + '%';
        } else {
            document.getElementById('medProfit').value = '0%';
        }
    }

    function calcGlassProfit() {
        let cost = parseFloat(document.getElementById('glassCost').value) || 0;
        let sales = parseFloat(document.getElementById('glassSales').value) || 0;
        if (cost > 0 && sales >= cost) {
            let profit = sales - cost;
            let percentage = (profit / cost) * 100;
            document.getElementById('glassProfit').value = percentage.toFixed(2) + '%';
        } else {
            document.getElementById('glassProfit').value = '0%';
        }
    }

    function savePatientBill() {
        let name = document.getElementById('patientName').value;
        if (!name) {
            alert("দয়া করে রোগীর নাম লিখুন!");
            return;
        }

        let data = {
            date: document.getElementById('billDate').value,
            name: name,
            age: document.getElementById('patientAge').value,
            mobile: document.getElementById('patientMobile').value,
            address: document.getElementById('patientAddress').value,
            doctor: document.getElementById('doctorName').value,
            doctorType: document.getElementById('doctorType').value,
            reference: document.getElementById('referenceName').value,
            cost: document.getElementById('billCost').value,
            sales: document.getElementById('billSales').value,
            profit: document.getElementById('billProfit').value
        };

        let list = JSON.parse(localStorage.getItem('hospital_bills')) || [];
        list.push(data);
        localStorage.setItem('hospital_bills', JSON.stringify(list));

        alert("Patient bill saved successfully!");
        window.print();
    }

    function addMedicineStock() {
        let name = document.getElementById('medName').value;
        if (!name) {
            alert("দয়া করে ওষুধের নাম লিখুন!");
            return;
        }
        let data = {
            name: name,
            category: document.getElementById('medCategory').value,
            qty: document.getElementById('medQty').value,
            cost: document.getElementById('medCost').value,
            sales: document.getElementById('medSales').value,
            profit: document.getElementById('medProfit').value
        };
        let list = JSON.parse(localStorage.getItem('hospital_medicines')) || [];
        list.push(data);
        localStorage.setItem('hospital_medicines', JSON.stringify(list));
        alert("Medicine stock added successfully!");
    }

    function addGlassStock() {
        let name = document.getElementById('glassName').value;
        if (!name) {
            alert("দয়া করে ফ্রেম/গ্লাস এর নাম লিখুন!");
            return;
        }
        let data = {
            name: name,
            model: document.getElementById('glassModel').value,
            qty: document.getElementById('glassQty').value,
            cost: document.getElementById('glassCost').value,
            sales: document.getElementById('glassSales').value,
            profit: document.getElementById('glassProfit').value
        };
        let list = JSON.parse(localStorage.getItem('hospital_glasses')) || [];
        list.push(data);
        localStorage.setItem('hospital_glasses', JSON.stringify(list));
        alert("Glasses stock added successfully!");
    }

    function saveExpense() {
        let reason = document.getElementById('expReason').value;
        if (!reason) {
            alert("দয়া করে খরচের বিবরণ লিখুন!");
            return;
        }
        let data = {
            date: document.getElementById('expDate').value,
            reason: reason,
            amount: document.getElementById('expAmount').value
        };
        let list = JSON.parse(localStorage.getItem('hospital_expenses')) || [];
        list.push(data);
        localStorage.setItem('hospital_expenses', JSON.stringify(list));
        alert("Expense saved successfully!");
    }

    function printSection(title) {
        window.print();
    }
</script>

</body>
</html>
